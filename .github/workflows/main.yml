        EOF

    - name: Build and Archive
      run: |
        cd IPTVApp
        xcodebuild clean build -project ../IPTVApp.xcodeproj -scheme IPTVApp -configuration Debug -sdk iphoneos ONLY_ACTIVE_ARCH=NO | xcpretty || exit 1
        
        # Find the .app file
        APP_PATH=$(find .. -name "*.app" -type d | head -n 1)
        echo "Found app at: $APP_PATH"
        
        # Create IPA
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -qr ../IPTVApp.ipa Payload/
        rm -rf Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: IPTVApp-ipa
        path: IPTVApp.ipa

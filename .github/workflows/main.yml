                    defaultConfigurationIsVisible = 0;
                    defaultConfigurationName = Release;
                };
                ABCDEF1234567890ABCDEF27 /* Build configuration list for PBXProject "IPTVApp" */ = {
                    isa = XCConfigurationList;
                    buildConfigurations = (
                        ABCDEF1234567890ABCDEF28 /* Debug */,
                        ABCDEF1234567890ABCDEF29 /* Release */,
                    );
                    defaultConfigurationIsVisible = 0;
                    defaultConfigurationName = Release;

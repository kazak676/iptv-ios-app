                        MTNTO_ENABLE_DEBUG_INFO = NO;
                        STRIP_INSTALLED_PRODUCT = YES;
                        VALIDATE_PRODUCT = YES;
                    };
                    name = Release;
                };
                ABCDEF1234567890ABCDEF30 /* Debug */ = {
                    isa = XCBuildConfiguration;
                    buildSettings = {
                        ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
                        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME = AccentColor;
                        CODE_SIGN_STYLE = Automatic;
                        CURRENT_PROJECT_VERSION = 1;
                        DEVELOPMENT_TEAM = "";
                        GENERATE_INFOPLIST_FILE = YES;
                        INFOPLIST_FILE = IPTVApp/Info.plist;
                        INFOPLIST_KEY_CFBundleDisplayName = "IPTV Player";
                        INFOPLIST_KEY_LSApplicationCategoryType = "";
                        INFOPLIST_KEY_UIApplicationSceneManifest_Generation = YES;
                        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents = YES;
                        INFOPLIST_KEY_UILaunchScreen_Generation = YES;
                        INFOPLIST_KEY_UIApplicationSupportsDirectImageInjection = YES;
                        INFOPLIST_KEY_UIApplicationSupportsRetroactiveHovering = YES;
                        INFOPLIST_KEY_UIApplicationSupportsSwitchToForegroundOnHomeButtonPress = YES;
                        LD_RUNPATH_SEARCH_PATHS = "$(inherited) @executable_path/Frameworks";
                        PRODUCT_BUNDLE_IDENTIFIER = com.user.IPTVApp;
                        PRODUCT_NAME = "$(TARGET_NAME)";
                        SWIFT_EMIT_LOC_STRINGS = YES;

                    buildRules = (
                    );
                    dependencies = (
                    );
                    name = IPTVApp;
                    productReference = ABCDEF1234567890ABCDEF16 /* IPTVApp.app */;
                    productType = "com.apple.product-type.application";
                };
                /* End PBXNativeTarget section */
                
                /* Begin PBXProject section */
                ABCDEF1234567890ABCDEF26 /* Project object */ = {
                    isa = PBXProject;
                    buildConfigurationList = ABCDEF1234567890ABCDEF27 /* Build configuration list for PBXProject "IPTVApp" */;
                    compatibilityVersion = "Xcode 9.0";
                    developmentRegion = en;
                    hasScannedForEncodings = 0;
                    knownRegions = (
                        en,
                        Base,
                    );
                    mainGroup = ABCDEF1234567890ABCDEF18 /* Root */;
                    productRefGroup = ABCDEF1234567890ABCDEF20 /* Products */;
                    projectDirPath = "";
                    projectRoot = "";
                    targets = (
                        ABCDEF1234567890ABCDEF21 /* IPTVApp */,
                    );
                };
                /* End PBXProject section */
                
                /* Begin PBXResourcesBuildPhase section */
                ABCDEF1234567890ABCDEF25 /* Resources */ = {
                    isa = PBXResourcesBuildPhase;
                    buildActionMask = 2147483647;
                    files = (
                    );
                    runOnlyForDeploymentPostprocessing = 0;
                };
                /* End PBXResourcesBuildPhase section */
                
                /* Begin PBXSourcesBuildPhase section */
                ABCDEF1234567890ABCDEF23 /* Sources */ = {
                    isa = PBXSourcesBuildPhase;
                    buildActionMask = 2147483647;
                    files = (
                        ABCDEF1234567890ABCDEF1234567890ABCDEF12 /* Main.swift in Sources */,
                        ABCDEF1234567890ABCDEF1234567890ABCDEF14 /* ChannelListController.swift in Sources */,
                    );
                    runOnlyForDeploymentPostprocessing = 0;
                };
                /* End PBXSourcesBuildPhase section */
                
                /* Begin XCBuildConfiguration section */
                ABCDEF1234567890ABCDEF28 /* Debug */ = {
                    isa = XCBuildConfiguration;
                    buildSettings = {
                        ALWAYS_SEARCH_USER_PATHS = NO;
                        CLANG_ANALYZER_NONNULL = YES;
                        CLANG_CXX_LANGUAGE_STANDARD = "gnu++14";

name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Set up Swift
      run: swift --version
      
    - name: Create Project Structure
      run: |
        mkdir -p IPTVApp/IPTVApp
        cp Main.swift IPTVApp/IPTVApp/
        cp ChannelListController.swift IPTVApp/IPTVApp/
        
        # Создаем Info.plist
        cat > IPTVApp/IPTVApp/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
                <key>NSAllowsArbitraryLoads</key>
                <true/>
            </dict>
            <key>UILaunchStoryboardName</key>
            <string></string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
        </dict>
        </plist>
        EOF

    - name: Create Xcode Project File
      run: |
        cat > IPTVApp.xcodeproj/project.pbxproj << 'EOF'
        // !$*UTF8*$!
        {
            archiveVersion = 1;
            classes = {
            };
            objects = {
                
                /* Begin PBXBuildFile section */
                ABCDEF1234567890ABCDEF12 /* Main.swift in Sources */ = {isa = PBXBuildFile; fileRef = ABCDEF1234567890ABCDEF13 /* Main.swift */; };
                ABCDEF1234567890ABCDEF14 /* ChannelListController.swift in Sources */ = {isa = PBXBuildFile; fileRef = ABCDEF1234567890ABCDEF15 /* ChannelListController.swift */; };
                /* End PBXBuildFile section */
                
                /* Begin PBXFileReference section */
                ABCDEF1234567890ABCDEF16 /* IPTVApp.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = IPTVApp.app; sourceTree = "<group>"; };
                ABCDEF1234567890ABCDEF13 /* Main.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Main.swift; sourceTree = "<group>"; };
                ABCDEF1234567890ABCDEF15 /* ChannelListController.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ChannelListController.swift; sourceTree = "<group>"; };
                ABCDEF1234567890ABCDEF17 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                /* End PBXFileReference section */
                
                /* Begin PBXGroup section */
                ABCDEF1234567890ABCDEF18 /* Root */ = {
                    isa = PBXGroup;
                    children = (
                        ABCDEF1234567890ABCDEF19 /* IPTVApp */,
                        ABCDEF1234567890ABCDEF20 /* Products */,
                    );
                    sourceTree = "<group>";
                };
                ABCDEF1234567890ABCDEF19 /* IPTVApp */ = {
                    isa = PBXGroup;
                    children = (
                        ABCDEF1234567890ABCDEF13 /* Main.swift */,
                        ABCDEF1234567890ABCDEF15 /* ChannelListController.swift */,
                        ABCDEF1234567890ABCDEF17 /* Info.plist */,
                    );
                    path = IPTVApp;
                    sourceTree = "<group>";
                };
                ABCDEF1234567890ABCDEF20 /* Products */ = {
                    isa = PBXGroup;
                    children = (
                        ABCDEF1234567890ABCDEF16 /* IPTVApp.app */,
                    );
                    name = Products;
                    sourceTree = "<group>";
                };
                /* End PBXGroup section */
                
                /* Begin PBXNativeTarget section */
                ABCDEF1234567890ABCDEF21 /* IPTVApp */ = {
                    isa = PBXNativeTarget;
                    buildConfigurationList = ABCDEF1234567890ABCDEF22 /* Build configuration list for PBXNativeTarget "IPTVApp" */;
                    buildPhases = (
                        ABCDEF1234567890ABCDEF23 /* Sources */,
                        ABCDEF1234567890ABCDEF24 /* Frameworks */,
                        ABCDEF1234567890ABCDEF25 /* Resources */,
